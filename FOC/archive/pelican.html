<script>
(() => {
  const $ = id => document.getElementById(id);
  const route = $('route'), length = route.getTotalLength(), duration = 23000;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reducedMotion.matches, elapsed = duration*.39, previous = null, rate = 1, frame = null;
  const transform = (id,value) => $(id).setAttribute('transform',value);
  const point = distance => route.getPointAtLength(Math.max(0,Math.min(length,distance)));
  const tangent = distance => {
    const a = point(distance-3), b = point(distance+3);
    return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  };
  // Two-link legs keep both webbed feet attached to their rotating pedals.
  function leg(id,footId,angle) {
    const hip = {x:-16,y:-79}, foot = {x:-3+15*Math.cos(angle),y:-8+15*Math.sin(angle)};
    const dx = foot.x-hip.x, dy = foot.y-hip.y, d = Math.hypot(dx,dy), upper = 48, lower = 45;
    const along = (upper*upper-lower*lower+d*d)/(2*d), height = Math.sqrt(Math.max(0,upper*upper-along*along));
    const knee = {x:hip.x+dx/d*along+dy/d*height,y:hip.y+dy/d*along-dx/d*height};
    $(id).setAttribute('d',`M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`);
    $(footId).setAttribute('d',`M${foot.x-7} ${foot.y-3}q12-2 22 6l-2 4-8-2-6 1-7-2Z`);
  }
  function render() {
    const progress = (elapsed%duration)/duration, distance = progress*length, position = point(distance);
    const angle = tangent(distance), curve = tangent(distance+27)-tangent(distance-27);
    const bank = Math.max(-10,Math.min(10,curve*.65));
    transform('rider',`translate(${position.x} ${position.y}) rotate(${angle}) translate(0 -34)`);
    transform('lean',`translate(0 34) skewX(${bank}) translate(0 -34)`);
    transform('shadow',`translate(${position.x} ${position.y+3}) rotate(${angle})`);
    const rotation = distance/34*180/Math.PI, pedalAngle = distance/34/1.8;
    transform('rear-wheel',`rotate(${rotation})`); transform('front-wheel',`rotate(${rotation})`);
    transform('crank',`translate(-3 -8) rotate(${pedalAngle*180/Math.PI})`);
    leg('far-leg','far-foot',pedalAngle+Math.PI); leg('near-leg','near-foot',pedalAngle);
    const flutter = Math.sin(elapsed/140);
    $('scarf-tail').setAttribute('d',`M18-148Q-10 ${-157+flutter*3}-36 ${-145+flutter*5}l8 5-6 9q34-16 56-9`);
    $('dust').setAttribute('opacity',String(.25+.2*Math.sin(elapsed/170)));
    transform('ripples',`translate(${Math.sin(elapsed/3000)*6} 0)`);
    $('phase').textContent = !playing ? '歇一小会' : Math.abs(curve)>6 ? '倾身过弯' : '沿海巡游';
    $('progress').style.width = `${progress*100}%`;
    $('velocity').textContent = `${playing ? Math.round(18*rate) : 0} km/h`;
  }
  function tick(now) {
    frame = null;
    if (!playing || document.hidden) return;
    if (previous!==null) elapsed += Math.min(now-previous,80)*rate;
    previous = now; render(); frame = requestAnimationFrame(tick);
  }
  function schedule() {
    previous = null;
    if (playing && !document.hidden && frame===null) frame = requestAnimationFrame(tick);
  }
  function syncControls() {
    $('play-label').textContent = playing ? '暂停骑行' : '继续骑行';
    $('play-icon').setAttribute('d',playing ? 'M2 1h3v10H2zM7 1h3v10H7z' : 'M3 1l8 5-8 5Z');
    $('toggle').setAttribute('aria-pressed',String(!playing)); render();
    if (!playing && frame!==null) {cancelAnimationFrame(frame);frame=null;}
    schedule();
  }
  $('toggle').addEventListener('click',() => {playing=!playing;syncControls();});
  $('restart').addEventListener('click',() => {elapsed=duration*.08;previous=null;render();});
  $('speed').addEventListener('click',() => {
    rate = rate===1 ? 1.5 : rate===1.5 ? .75 : 1;
    $('speed').textContent = `${rate===1 ? '1.0' : rate}×`;
    $('speed').setAttribute('aria-label',`骑行速度，当前 ${rate} 倍`);render();
  });
  document.addEventListener('visibilitychange',() => {
    if (document.hidden && frame!==null) {cancelAnimationFrame(frame);frame=null;}
    schedule();
  });
  reducedMotion.addEventListener('change',event => {if(event.matches){playing=false;syncControls();}});
  syncControls();
})();
</script>
</body>
</html>
